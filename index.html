<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年分县区人才队伍月报 · 逐月填报系统</title>
<!-- ========== 接入 Supabase 前，把下面两个值换成你的项目 ==========
     supabase.com → Project Settings → API：
       Project URL → SUPABASE_URL ； anon public key → SUPABASE_ANON_KEY
================================================================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef2f7; color: #333; min-height: 100vh; padding-bottom: 40px; }
  .container { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.07); padding: 24px; margin-bottom: 20px; }
  h1 { font-size: 21px; color: #1a2a4a; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
  h2 { font-size: 16px; color: #1a2a4a; margin-bottom: 14px; }
  h3 { font-size: 14px; color: #2c3e50; margin: 22px 0 12px; padding-top: 14px; border-top: 1px dashed #dfe4ec; }
  .role-badge { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 13px; margin-bottom: 14px; }
  .role-member { background: #e8f0fe; color: #1a73e8; }
  .role-admin { background: #fdeee0; color: #d95b0c; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 10px; }
  .btn { display: inline-block; border: none; border-radius: 8px; padding: 9px 18px; font-size: 14px; cursor: pointer; transition: .2s; }
  .btn-primary { background: #1a73e8; color: #fff; } .btn-primary:hover { background: #1765cc; }
  .btn-secondary { background: #fff; color: #333; border: 1px solid #d0d7e2; } .btn-secondary:hover { background: #f5f7fa; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 13px; margin-bottom: 5px; color: #555; font-weight: 500; }
  input, select { width: 100%; padding: 9px 12px; border: 1px solid #d0d7e2; border-radius: 8px; font-size: 14px; background:#fff; }
  input:focus, select:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.12); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .readonly-input { background: #f6f8fb; color: #4a5568; }
  .hint { font-size: 12px; color: #98a2b3; margin-top: 4px; }
  .save-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; gap: 10px; }
  .status { font-size: 13px; color: #0b8043; }
  .notice { font-size: 13px; color: #d93025; margin-top: 14px; line-height: 1.7; }
  .notice-info { font-size: 13px; color: #5a6472; margin-top: 14px; line-height: 1.7; background: #f7f9fc; padding: 12px 14px; border-radius: 8px; }
  .hidden { display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { border: 1px solid #dfe4ec; padding: 7px 8px; text-align: center; vertical-align: middle; }
  th { background: #f4f6fb; font-weight: 600; }
  td.req { text-align: left; font-weight: 500; }
  .pct-low { color: #c5221f; } .pct-mid { color: #b06000; } .pct-high { color: #137333; font-weight: 600; }
  .error { color: #d93025; font-size: 13px; margin-top: 8px; }
  .tabs { display: flex; gap: 8px; margin: 14px 0; }
  .tab { padding: 8px 16px; border: 1px solid #d0d7e2; border-radius: 8px; cursor: pointer; font-size: 13px; background:#fff; color:#333; }
  .tab.active { background: #1a73e8; color:#fff; border-color:#1a73e8; }
  .row-flex { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .field-inline { display:inline-block; }
  .field-inline label { margin-right:6px; display:inline; }
  .field-inline select { width:auto; display:inline-block; }
  .history-table td.left { text-align:left; font-size:12px; color:#444; }
</style>
</head>
<body>
<div class="container">

  <!-- ========== 登录页（无注册，账号由管理员预设） ========== -->
  <div id="authView" class="card" style="max-width:440px;margin:40px auto 0;">
    <h1 id="mainH1">2026年分县区人才队伍月报</h1>
    <div class="subtitle">报规统处 · 逐月填报系统</div>
    <h2>登录</h2>
    <div class="field"><label>账号</label><input id="loginEmail" type="text"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">登 录</button>
    <div class="error" id="loginErr"></div>
  </div>

  <!-- ========== 主界面（登录后） ========== -->
  <div id="mainView" class="hidden">
    <div class="card">
      <div class="topbar">
        <div>
          <span class="role-badge" id="roleBadge"></span>
          <h2 id="greeting"></h2>
        </div>
        <div class="row-flex">
          <span id="userEmail" style="font-size:13px;color:#666;"></span>
          <button class="btn btn-secondary btn-sm" onclick="doLogout()">退出</button>
        </div>
      </div>

      <!-- 月份选择 -->
      <div class="row-flex" style="margin-bottom:8px;">
        <div class="field-inline"><label>选择月份：</label><select id="monthSelect" onchange="onMonthChange()"></select></div>
      </div>

      <!-- 填报员视图 -->
      <div id="memberForm" class="hidden">
        <p class="notice-info">若当月存在净减少（如撤销、退补、更正已确认人数），可直接填写<strong>负数</strong>，系统会按当月增减量累计。</p>
        <h3>① 开展培训（培训总计 ＝ 补贴性培训 ＋ 公益免费 ＋ 百行百业）</h3>
        <div class="field"><label>全年目标（只读）</label><input id="f_peixun_target" type="number" readonly class="readonly-input"></div>
        <div class="grid">
          <div class="field"><label>本月新增 · 企业职工</label><input id="f_peixun_qiye_c" type="number"></div>
          <div class="field"><label>本月新增 · 就业重点群体</label><input id="f_peixun_zhongdian_c" type="number"></div>
          <div class="field"><label>本月新增 · 创业培训</label><input id="f_peixun_chuangye_c" type="number"></div>
          <div class="field"><label>本月新增 · 公益免费</label><input id="f_peixun_gongyi_c" type="number"></div>
          <div class="field"><label>本月新增 · 百行百业（仅市本级）</label><input id="f_peixun_baihang_c" type="number"></div>
        </div>
        <div class="hint">补贴性小计：企业 <b id="c_peixun_qiye">0</b>＋重点 <b id="c_peixun_zhongdian">0</b>＋创业 <b id="c_peixun_chuangye">0</b>；公益免费 <b id="c_peixun_gongyi">0</b>；百行百业 <b id="c_peixun_baihang">0</b>；培训总计 <b id="c_peixun">0</b></div>

        <h3>② 新增技能人才人数</h3>
        <div class="field"><label>全年目标（只读）</label><input id="f_jineng_target" type="number" readonly class="readonly-input"></div>
        <div class="grid">
          <div class="field"><label>本月新增 · 省级</label><input id="f_jineng_sheng_c" type="number"></div>
          <div class="field"><label>本月新增 · 市级</label><input id="f_jineng_shi_c" type="number"></div>
        </div>
        <div class="hint">截至本月累计：省级 <b id="c_jineng_sheng">0</b> + 市级 <b id="c_jineng_shi">0</b> = <b id="c_jineng">0</b></div>

        <h3>③ 新增取得高级工以上证书人数</h3>
        <div class="field"><label>全年目标（只读）</label><input id="f_gjg_target" type="number" readonly class="readonly-input"></div>
        <div class="grid">
          <div class="field"><label>本月新增 · 省级</label><input id="f_gjg_sheng_c" type="number"></div>
          <div class="field"><label>本月新增 · 市级</label><input id="f_gjg_shi_c" type="number"></div>
        </div>
        <div class="hint">截至本月累计：省级 <b id="c_gjg_sheng">0</b> + 市级 <b id="c_gjg_shi">0</b> = <b id="c_gjg">0</b></div>

        <div class="save-row">
          <span class="status" id="saveStatus"></span>
          <button class="btn btn-primary" onclick="saveMember()">保存本月填报</button>
        </div>
        <p class="notice" id="memberNotice"></p>

        <h3>历史填写记录（本县区）</h3>
        <div id="memberHistory"></div>
      </div>

      <!-- 管理员视图 -->
      <div id="adminPanel" class="hidden">
        <div class="save-row" style="margin-bottom:10px;">
          <span class="hint" id="exportHint">导出「截至 {所选月份}」的分县区完成情况表</span>
          <button class="btn btn-primary" onclick="exportExcel()">导出 Excel</button>
        </div>
        <div class="tabs">
          <div class="tab active" id="tab_cur" onclick="switchAdminTab('cur')">当月新增表</div>
          <div class="tab" id="tab_cum" onclick="switchAdminTab('cum')">累计表</div>
          <div class="tab" id="tab_log" onclick="switchAdminTab('log')">填写记录</div>
        </div>
        <div id="adminCur" class="hidden"></div>
        <div id="adminCum" class="hidden"></div>
        <div id="adminLog" class="hidden"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
 * 配置：替换成你的 Supabase 项目
 * =================================================================== */
var SUPABASE_URL = "https://zyvmtoxjpnveaeokumts.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5dm10b3hqcG52ZWFlb2t1bXRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyMzcwMjAsImV4cCI6MjEwNzgxMzAyMH0.0tsFK1yZBVBzoaLCgCwqXjO_Wvs-IHruiJHo89aRBME";

var REGIONS = ["市本级","小店区","迎泽区","杏花岭区","尖草坪区","万柏林区","晋源区","清徐县","阳曲县","娄烦县","古交市","综改区"];
var FIELD_NAMES = {
  peixun_qiye_c:"培训·企业职工", peixun_zhongdian_c:"培训·就业重点群体", peixun_chuangye_c:"培训·创业",
  peixun_gongyi_c:"培训·公益免费", peixun_baihang_c:"培训·百行百业",
  jineng_sheng_c:"技能·省级", jineng_shi_c:"技能·市级",
  gjg_sheng_c:"高级工·省级", gjg_shi_c:"高级工·市级"
};

var sb = null, currentProfile = null;
var regionsData = {};
var myRows = {};
var adminRows = {};
var CURRENT_MONTH = null;

function ym(d){ var x=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); return x; }

function init(){
  if(SUPABASE_URL.indexOf("YOUR_")===0){ alert("请先在 index.html 顶部填入 Supabase Project URL 和 anon key（见 README）"); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true } });
  CURRENT_MONTH = ym(new Date());
  fillMonthOptions();
  sb.auth.getSession().then(function(res){
    if(res.data.session){ afterAuth(); } else { showAuth(true); }
  });
}
function showAuth(show){
  document.getElementById("authView").classList.toggle("hidden", !show);
  document.getElementById("mainView").classList.toggle("hidden", show);
}
function fillMonthOptions(){
  var sel = document.getElementById("monthSelect");
  var now = new Date();
  var curYear = now.getFullYear();
  var opts = [];
  // 跨年：最近 5 年；当年到当前月，其余年份到 12 月
  for(var y = curYear; y >= curYear - 4; y--){
    var lastMonth = (y === curYear) ? (now.getMonth() + 1) : 12;
    for(var m = lastMonth; m >= 1; m--){
      var v = y + '-' + String(m).padStart(2, '0');
      opts.push('<option value="'+v+'"'+(v===CURRENT_MONTH?' selected':'')+'>'+v+'</option>');
    }
  }
  sel.innerHTML = opts.join('');
}

function doLogin(){
  var email = document.getElementById("loginEmail").value.trim();
  var pass = document.getElementById("loginPass").value;
  document.getElementById("loginErr").textContent = "";
  sb.auth.signInWithPassword({ email: email, password: pass }).then(function(res){
    if(res.error){ document.getElementById("loginErr").textContent = res.error.message; return; }
    afterAuth();
  });
}
function doLogout(){ sb.auth.signOut().then(function(){ currentProfile=null; location.reload(); }); }

function afterAuth(){
  sb.auth.getUser().then(function(res){
    var user = res.data.user;
    document.getElementById("userEmail").textContent = user.email;
    sb.from("profiles").select("*").eq("id", user.id).single().then(function(pr){
      if(pr.error || !pr.data){
        alert("未找到该账号的县区档案，请联系管理员在后台绑定。");
        doLogout();
        return;
      }
      currentProfile = pr.data;
      showAuth(false);
      loadRegions(function(){ renderMain(); });
    });
  });
}

function loadRegions(cb){
  sb.from("regions").select("*").then(function(res){
    if(res.error){ alert("加载目标数据失败："+res.error.message); return; }
    regionsData = {};
    (res.data||[]).forEach(function(r){ regionsData[r.region]=r; });
    cb && cb();
  });
}

function renderMain(){
  var badge = document.getElementById("roleBadge");
  if(currentProfile.is_admin){
    badge.className="role-badge role-admin"; badge.textContent="管理员";
    document.getElementById("greeting").textContent="分县区汇总";
    document.getElementById("memberForm").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
    updateExportHint();
    loadAdminData();
  } else {
    badge.className="role-badge role-member";
    badge.textContent = "填报员 · "+(currentProfile.region||"未绑定");
    document.getElementById("greeting").textContent="数据填报";
    document.getElementById("adminPanel").classList.add("hidden");
    document.getElementById("memberForm").classList.remove("hidden");
    sb.from("monthly_reports").select("*").eq("region", currentProfile.region).then(function(res){
      if(res.error){ document.getElementById("memberNotice").textContent="读取失败："+res.error.message; return; }
      myRows = {};
      (res.data||[]).forEach(function(r){ (myRows[r.region]=myRows[r.region]||{})[r.report_month]=r; });
      renderMember();
    });
  }
}

function onMonthChange(){
  if(!currentProfile) return;
  updateTitleYear();
  if(currentProfile.is_admin){ renderAdminTables(); renderAdminLog(); updateExportHint(); }
  else { renderMember(); }
}
function updateTitleYear(){
  var m = document.getElementById("monthSelect").value; // YYYY-MM
  var y = m.split("-")[0];
  var h1 = document.getElementById("mainH1");
  if(h1){ h1.textContent = y + "年分县区人才队伍月报"; }
  document.title = y + "年分县区人才队伍月报 · 逐月填报系统";
}
function updateExportHint(){
  var ev = document.getElementById("exportHint");
  if(ev){ ev.textContent = "导出「截至 " + document.getElementById("monthSelect").value + "」的分县区完成情况表（累计）；也请在下方确认填报记录已同步。"; }
}

/* ---------- 填报员 ---------- */
function renderMember(){
  var region = currentProfile.region, month = document.getElementById("monthSelect").value;
  var t = regionsData[region] || {};
  setVal("f_peixun_target", t.peixun_target);
  setVal("f_jineng_target", t.jineng_target);
  setVal("f_gjg_target", t.gjg_target);
  var row = (myRows[region]||{})[month] || {};
  setVal("f_peixun_qiye_c", row.peixun_qiye_c);
  setVal("f_peixun_zhongdian_c", row.peixun_zhongdian_c);
  setVal("f_peixun_chuangye_c", row.peixun_chuangye_c);
  setVal("f_peixun_gongyi_c", row.peixun_gongyi_c);
  // 百行百业仅市本级可填，其他区县禁用并置空
  var isShi = (region === "市本级");
  var bh = document.getElementById("f_peixun_baihang_c");
  bh.disabled = !isShi;
  bh.value = isShi ? (row.peixun_baihang_c == null ? "" : row.peixun_baihang_c) : "";
  setVal("f_jineng_sheng_c", row.jineng_sheng_c);
  setVal("f_jineng_shi_c", row.jineng_shi_c);
  setVal("f_gjg_sheng_c", row.gjg_sheng_c);
  setVal("f_gjg_shi_c", row.gjg_shi_c);
  computeCum(region, month);
  document.getElementById("memberNotice").textContent = ((myRows[region]||{})[month] && row.updated_at)
    ? ("本月已填报："+new Date(row.updated_at).toLocaleString()) : "本月尚未填报";
  document.getElementById("saveStatus").textContent = "";
  renderHistory(region);
}
function renderHistory(region){
  region = region || ((currentProfile||{}).region);
  var el = document.getElementById("memberHistory");
  if(!el) return;
  var months = Object.keys((myRows[region]||{})).sort().reverse(); // 月份倒序（新→旧）
  if(months.length === 0){ el.innerHTML = '<p style="color:#999;padding:8px 0;">暂无历史填报记录。</p>'; return; }
  var html = '<p class="notice-info">本县区各月填报情况（倒序）</p>';
  html += '<table><thead><tr>'+
    '<th>月份</th><th>培训·企业</th><th>培训·重点</th><th>培训·创业</th><th>公益免费</th><th>百行百业</th>'+
    '<th>技能·省</th><th>技能·市</th><th>高级工·省</th><th>高级工·市</th><th>填报时间</th></tr></thead><tbody>';
  months.forEach(function(m){
    var r = (myRows[region]||{})[m] || {};
    html += '<tr><td>'+m+'</td>'+
      '<td>'+(+r.peixun_qiye_c||0)+'</td><td>'+(+r.peixun_zhongdian_c||0)+'</td><td>'+(+r.peixun_chuangye_c||0)+'</td>'+
      '<td>'+(+r.peixun_gongyi_c||0)+'</td><td>'+(+r.peixun_baihang_c||0)+'</td>'+
      '<td>'+(+r.jineng_sheng_c||0)+'</td><td>'+(+r.jineng_shi_c||0)+'</td>'+
      '<td>'+(+r.gjg_sheng_c||0)+'</td><td>'+(+r.gjg_shi_c||0)+'</td>'+
      '<td>'+(r.updated_at ? new Date(r.updated_at).toLocaleString() : '')+'</td></tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}
function computeCum(region, month){
  var rows = myRows[region] || {};
  function sumField(f){
    var s=0;
    Object.keys(rows).forEach(function(m){ if(m<=month) s += (+rows[m][f]||0); });
    return s;
  }
  document.getElementById("c_peixun_qiye").textContent = sumField("peixun_qiye_c");
  document.getElementById("c_peixun_zhongdian").textContent = sumField("peixun_zhongdian_c");
  document.getElementById("c_peixun_chuangye").textContent = sumField("peixun_chuangye_c");
  document.getElementById("c_peixun_gongyi").textContent = sumField("peixun_gongyi_c");
  document.getElementById("c_peixun_baihang").textContent = sumField("peixun_baihang_c");
  var pq=sumField("peixun_qiye_c"), pz=sumField("peixun_zhongdian_c"), pqc=sumField("peixun_chuangye_c"),
      pg=sumField("peixun_gongyi_c"), pb=sumField("peixun_baihang_c");
  document.getElementById("c_peixun").textContent = pq+pz+pqc+pg+pb;
  var js=sumField("jineng_sheng_c"), jsh=sumField("jineng_shi_c");
  document.getElementById("c_jineng_sheng").textContent=js;
  document.getElementById("c_jineng_shi").textContent=jsh;
  document.getElementById("c_jineng").textContent=js+jsh;
  var gs=sumField("gjg_sheng_c"), gsh=sumField("gjg_shi_c");
  document.getElementById("c_gjg_sheng").textContent=gs;
  document.getElementById("c_gjg_shi").textContent=gsh;
  document.getElementById("c_gjg").textContent=gs+gsh;
}
function saveMember(){
  var region = currentProfile.region, month = document.getElementById("monthSelect").value;
  if(!region){ return; }
  var payload = {
    report_month: month, region: region,
    peixun_qiye_c:      + (document.getElementById("f_peixun_qiye_c").value || 0),
    peixun_zhongdian_c: + (document.getElementById("f_peixun_zhongdian_c").value || 0),
    peixun_chuangye_c:  + (document.getElementById("f_peixun_chuangye_c").value || 0),
    peixun_gongyi_c:    + (document.getElementById("f_peixun_gongyi_c").value || 0),
    peixun_baihang_c:   + (document.getElementById("f_peixun_baihang_c").value || 0),
    jineng_sheng_c:+ (document.getElementById("f_jineng_sheng_c").value || 0),
    jineng_shi_c:  + (document.getElementById("f_jineng_shi_c").value || 0),
    gjg_sheng_c:   + (document.getElementById("f_gjg_sheng_c").value || 0),
    gjg_shi_c:     + (document.getElementById("f_gjg_shi_c").value || 0),
    updated_by:    currentProfile.id,
    updated_at:    new Date().toISOString()
  };
  var existing=(myRows[region]||{})[month];
  if(existing){
    sb.from("monthly_reports").update(payload).eq("id", existing.id).then(function(res){
      if(res.error){ document.getElementById("memberNotice").textContent="保存失败："+res.error.message; return; }
      document.getElementById("saveStatus").textContent="已保存 "+month;
      afterSave(region);
    });
  } else {
    sb.from("monthly_reports").insert(payload).then(function(res){
      if(res.error){ document.getElementById("memberNotice").textContent="保存失败："+res.error.message; return; }
      document.getElementById("saveStatus").textContent="已保存 "+month;
      afterSave(region);
    });
  }
}
function afterSave(region){
  sb.from("monthly_reports").select("*").eq("region", region).then(function(res){
    myRows[region]={};
    (res.data||[]).forEach(function(r){ (myRows[r.region]=myRows[r.region]||{})[r.report_month]=r; });
    renderMember();
  });
}

/* ---------- 管理员 ---------- */
function loadAdminData(){
  sb.from("monthly_reports").select("*").then(function(res){
    if(res.error){ document.getElementById("adminCur").innerHTML='<div class="notice">'+res.error.message+'</div>'; return; }
    adminRows = {};
    (res.data||[]).forEach(function(r){ (adminRows[r.region]=adminRows[r.region]||{})[r.report_month]=r; });
    renderAdminTables();
    renderAdminLog();
  });
}
function renderAdminTables(){
  var month = document.getElementById("monthSelect").value;
  document.getElementById("adminCur").innerHTML = adminBuildTable(month, "cur");
  document.getElementById("adminCum").innerHTML = adminBuildTable(month, "cum");
}
function adminBuildTable(month, mode){
  var html = '<p class="notice-info">'+(mode==="cur"?"当月新增表（"+month+"）":"累计表（截至"+month+"）")+'</p>';
  html += '<table><thead><tr>'+
    '<th rowspan="2">县区</th><th colspan="6">开展补贴性职业技能培训</th><th colspan="5">技能人才</th><th colspan="5">高级工以上</th>'+
    '<th rowspan="2">公益免费类</th><th rowspan="2">百行百业<br>(仅市本级)</th><th rowspan="2">太原市培训<br>(=培训+公益+百行)</th></tr>'+
    '<tr><th>目标任务</th><th>企业职工</th><th>重点群体</th><th>创业</th><th>完成情况</th><th>%</th>'+
    '<th>目标任务</th><th>省级</th><th>市级</th><th>总计</th><th>%</th>'+
    '<th>目标任务</th><th>省级</th><th>市级</th><th>总计</th><th>%</th></tr></thead><tbody>';
  var sum = { p1:0,p2:0,p3:0,pG:0,pB:0, j1:0,j2:0,g1:0,g2:0, pt:0,jt:0,gt:0 };
  REGIONS.forEach(function(region){
    var t = regionsData[region]||{};
    var rows = adminRows[region]||{};
    var r; var p1=0,p2=0,p3=0,pG=0,pB=0, j1=0,j2=0,g1=0,g2=0;
    function acc(row){
      p1+=+row.peixun_qiye_c||0; p2+=+row.peixun_zhongdian_c||0; p3+=+row.peixun_chuangye_c||0;
      pG+=+row.peixun_gongyi_c||0; pB+=+row.peixun_baihang_c||0;
      j1+=+row.jineng_sheng_c||0; j2+=+row.jineng_shi_c||0; g1+=+row.gjg_sheng_c||0; g2+=+row.gjg_shi_c||0;
    }
    if(mode==="cur"){
      r = rows[month]||{}; acc(r);
    } else {
      Object.keys(rows).forEach(function(m){ if(m<=month) acc(rows[m]); });
    }
    var pF = p1+p2+p3;             // 培训完成情况 = 企业+重点+创业（不含公益百行）
    var pTai = pF + pG + pB;       // 太原市培训 = 培训完成情况 + 公益 + 百行
    var jt = j1+j2, gt = g1+g2;
    sum.p1+=p1; sum.p2+=p2; sum.p3+=p3; sum.pG+=pG; sum.pB+=pB; sum.j1+=j1; sum.j2+=j2; sum.g1+=g1; sum.g2+=g2;
    sum.pt+=+t.peixun_target||0; sum.jt+=+t.jineng_target||0; sum.gt+=+t.gjg_target||0;
    html += '<tr><td class="req">'+region+'</td>'+
      '<td>'+(+t.peixun_target||0)+'</td><td>'+p1+'</td><td>'+p2+'</td><td>'+p3+'</td><td>'+pF+'</td><td>'+pctCell(pF,t.peixun_target)+'</td>'+
      '<td>'+(+t.jineng_target||0)+'</td><td>'+j1+'</td><td>'+j2+'</td><td>'+jt+'</td><td>'+pctCell(jt,t.jineng_target)+'</td>'+
      '<td>'+(+t.gjg_target||0)+'</td><td>'+g1+'</td><td>'+g2+'</td><td>'+gt+'</td><td>'+pctCell(gt,t.gjg_target)+'</td>'+
      '<td>'+pG+'</td><td>'+pB+'</td><td>'+pTai+'</td></tr>';
  });
  var sF = sum.p1+sum.p2+sum.p3, sTai = sF+sum.pG+sum.pB, sJT=sum.j1+sum.j2, sGT=sum.g1+sum.g2;
  html += '<tr style="background:#fff7e6;font-weight:600;"><td class="req">太原市（汇总）</td>'+
    '<td>'+sum.pt+'</td><td>'+sum.p1+'</td><td>'+sum.p2+'</td><td>'+sum.p3+'</td><td>'+sF+'</td><td>'+pctCell(sF,sum.pt)+'</td>'+
    '<td>'+sum.jt+'</td><td>'+sum.j1+'</td><td>'+sum.j2+'</td><td>'+sJT+'</td><td>'+pctCell(sJT,sum.jt)+'</td>'+
    '<td>'+sum.gt+'</td><td>'+sum.g1+'</td><td>'+sum.g2+'</td><td>'+sGT+'</td><td>'+pctCell(sGT,sum.gt)+'</td>'+
    '<td>'+sum.pG+'</td><td>'+sum.pB+'</td><td>'+sTai+'</td></tr>';
  html += '</tbody></table>';
  return html;
}
function renderAdminLog(){
  sb.from("fill_logs").select("*").order("filled_at",{ascending:false}).then(function(res){
    var logs = res.data||[];
    var html0 = '<p class="notice-info">填写记录（每次修改留痕，按时间倒序，最多显示 200 条）</p>';
    if(logs.length===0){ html0+='<div style="color:#999;padding:20px;">暂无记录</div>'; }
    else {
      html0 += '<table><thead><tr><th>时间</th><th>县区</th><th>月份</th><th>字段</th><th>旧值</th><th>新值</th></tr></thead><tbody>';
      logs.slice(0,200).forEach(function(l){
        html0 += '<tr class="history-table"><td class="left">'+(l.filled_at?new Date(l.filled_at).toLocaleString():'')+'</td>'+
          '<td>'+l.region+'</td><td>'+l.report_month+'</td><td>'+(FIELD_NAMES[l.field]||l.field)+'</td>'+
          '<td>'+l.old_value+'</td><td>'+l.new_value+'</td></tr>';
      });
      html0 += '</tbody></table>';
    }
    document.getElementById("adminLog").innerHTML = html0;
  });
}
function switchAdminTab(t){
  ["cur","cum","log"].forEach(function(x){
    document.getElementById("tab_"+x).classList.toggle("active", x===t);
    document.getElementById("admin"+ (x==="cur"?"Cur":(x==="cum"?"Cum":"Log"))).classList.toggle("hidden", x!==t);
  });
}

/* ---------- 导出 Excel（管理员） ---------- */
// 计算某县区 1 月 ~ 指定月份 的某一字段累计值
function cumVal(region, month, field){
  var rows = adminRows[region] || {}, s = 0;
  Object.keys(rows).forEach(function(m){ if(m <= month) s += (+rows[m][field] || 0); });
  return s;
}
// 生成符合《2026年分县区人才队伍建设计划完成情况》模板的 xlsx 并下载
function exportExcel(){
  if(!currentProfile || !currentProfile.is_admin){
    alert("仅管理员可导出 Excel。"); return;
  }
  if(typeof XLSX === "undefined"){
    alert("Excel 组件未加载，请检查网络后刷新页面。"); return;
  }
  var month = document.getElementById("monthSelect").value; // YYYY-MM
  var ymParts = month.split("-");
  var year = ymParts[0], mm = ymParts[1];
  // 截至第 mm 月的当月最后一天
  var endDate = new Date(+year, +mm, 0);
  var dateLabel = "截至" + year + "年" + (+mm) + "月" + endDate.getDate() + "日";

  // 逐县区累计数据（顺序：第11行太原市，第12-23行区县）
  function regionRow(region){
    var t = regionsData[region] || {};
    return {
      name: region,
      p_t:  +t.peixun_target||0,
      p_qiye:      cumVal(region, month, "peixun_qiye_c"),
      p_zhongdian: cumVal(region, month, "peixun_zhongdian_c"),
      p_chuangye:  cumVal(region, month, "peixun_chuangye_c"),
      p_gongyi:    cumVal(region, month, "peixun_gongyi_c"),
      p_baihang:   cumVal(region, month, "peixun_baihang_c"),
      j_t:  +t.jineng_target||0,  j_s:  cumVal(region, month, "jineng_sheng_c"), j_shi: cumVal(region, month, "jineng_shi_c"),
      g_t:  +t.gjg_target||0,     g_s:  cumVal(region, month, "gjg_sheng_c"),   g_shi: cumVal(region, month, "gjg_shi_c")
    };
  }
  // P_F: 开展培训完成情况 = 企业+重点+创业（不含公益/百行）；技能/高级工 总计 = 省+市；太原培训 = 培训完成+公益+百行
  function totalsOf(r){
    var pF = r.p_qiye + r.p_zhongdian + r.p_chuangye;
    return { pF:pF, pTai: pF + r.p_gongyi + r.p_baihang, j_tot: r.j_s+r.j_shi, g_tot: r.g_s+r.g_shi };
  }
  var detail = REGIONS.map(regionRow);
  // 太原市（汇总）行：加总
  var tai = { name:"太原市", p_t:0,p_qiye:0,p_zhongdian:0,p_chuangye:0,p_gongyi:0,p_baihang:0, j_t:0,j_s:0,j_shi:0, g_t:0,g_s:0,g_shi:0 };
  detail.forEach(function(r){
    tai.p_t+=r.p_t; tai.p_qiye+=r.p_qiye; tai.p_zhongdian+=r.p_zhongdian; tai.p_chuangye+=r.p_chuangye;
    tai.p_gongyi+=r.p_gongyi; tai.p_baihang+=r.p_baihang;
    tai.j_t+=r.j_t; tai.j_s+=r.j_s; tai.j_shi+=r.j_shi;
    tai.g_t+=r.g_t; tai.g_s+=r.g_s; tai.g_shi+=r.g_shi;
  });
  var rows = [tai].concat(detail);

  // ========= 构建 SheetJS 工作表 =========
  // 行号（1 起）：1-2 标题, 4 截至, 6-10 表头, 11 太原市, 12-23 区县, 24 签名
  function cellSheetRow(idx){ return (idx + 11); } // rows 数组下标 0(太原)->行11, 1(市本级)->12 … 12(综改)->23

  // 列布局（0 起，A=0 … T=19，共 20 列）
  // 开展培训：B目标 C企业 D重点 E创业 F完成情况 G%；技能：H目标 I省 J市 K总计 L%；高级工：M目标 N省 O市 P总计 Q%；R公益 S百行 T太原培训
  var aoa = [];
  for(var i=0;i<24;i++){ aoa.push(new Array(20).fill(null)); }
  aoa[0][0] = year + "年分县区人才队伍建设计划完成情况";               // 行1 A1（动态年份）
  aoa[3][0] = "                                        " + dateLabel;   // 行4 A4
  // 表头 第6行(索引5)、第8行(索引7)、第10行(索引9)
  aoa[5][0]  = "县区";
  aoa[5][1]  = "开展补贴性职业技能培训人数";
  aoa[5][7]  = "新增技能人才人数";
  aoa[5][12] = "新增取得高级工以上职业资格\n或职业技能等级证书的人数";
  aoa[5][17] = "公益免费类";
  aoa[5][18] = "百行百业\n（只有市本级）";
  aoa[5][19] = "太原市培训\n（补贴性培训加公益免费加百行百业）";
  aoa[7][1]  = "目标任务"; aoa[7][2] = "完成情况（企业职工加重点群体加创业等于完成情况）"; aoa[7][6] = "完成百分比";
  aoa[7][7]  = "目标任务"; aoa[7][8] = "完成情况"; aoa[7][11] = "完成百分比";
  aoa[7][12] = "目标任务"; aoa[7][13] = "完成情况"; aoa[7][16] = "完成百分比";
  aoa[9][2]  = "企业职工培训"; aoa[9][3] = "就业重点群体培训"; aoa[9][4] = "创业培训";
  aoa[9][8]  = "省级"; aoa[9][9] = "市级"; aoa[9][10] = "总计";
  aoa[9][13] = "省级"; aoa[9][14] = "市级"; aoa[9][15] = "总计";
  // 数据行
  rows.forEach(function(r, idx){
    var sr = cellSheetRow(idx);            // sheet 行号
    var a = aoa[sr-1];
    var tot = totalsOf(r);
    a[0]  = r.name;
    a[1]  = r.p_t; a[2] = r.p_qiye; a[3] = r.p_zhongdian; a[4] = r.p_chuangye; a[5] = tot.pF;   // G 用公式
    a[7]  = r.j_t; a[8] = r.j_s; a[9] = r.j_shi; a[10] = tot.j_tot;                               // L 用公式
    a[12] = r.g_t; a[13]= r.g_s; a[14]= r.g_shi; a[15]= tot.g_tot;                                // Q 用公式
    a[17] = r.p_gongyi;  // R 公益免费（单独）
    a[18] = r.p_baihang; // S 百行百业（单独）
    a[19] = tot.pTai;    // T 太原市培训
  });
  aoa[23][0] = "单位负责人：                                       处（科）室负责人：                                                     填报人：";

  var ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: false });
  // 列宽
  ws['!cols'] = [
    {wch:11},{wch:9},{wch:25},{wch:11},{wch:10},{wch:10},{wch:9},
    {wch:8},{wch:7},{wch:7},{wch:7},{wch:8},
    {wch:8},{wch:7},{wch:7},{wch:7},{wch:8},
    {wch:10},{wch:10},{wch:12}
  ];
  // 合并单元格（对齐模板：三级表头 6-10 行，数据 11-23，签名 24）
  ws['!merges'] = [
    {s:{r:0,c:0},e:{r:1,c:19}},   // A1:T2 标题
    {s:{r:3,c:0},e:{r:3,c:19}},   // A4:T4 截至
    {s:{r:5,c:0},e:{r:9,c:0}},    // A6:A10 县区
    {s:{r:5,c:1},e:{r:6,c:6}},    // B6:G7 培训
    {s:{r:5,c:7},e:{r:6,c:11}},   // H6:L7 技能
    {s:{r:5,c:12},e:{r:6,c:16}},  // M6:Q7 高级工
    {s:{r:5,c:17},e:{r:9,c:17}},  // R6:R10 公益免费
    {s:{r:5,c:18},e:{r:9,c:18}},  // S6:S10 百行百业
    {s:{r:5,c:19},e:{r:9,c:19}},  // T6:T10 太原培训
    {s:{r:7,c:1},e:{r:9,c:1}},    // B8:B10 目标任务
    {s:{r:7,c:2},e:{r:8,c:5}},    // C8:F9 完成情况（培训）
    {s:{r:7,c:6},e:{r:9,c:6}},    // G8:G10 完成百分比
    {s:{r:7,c:7},e:{r:9,c:7}},    // H8:H10 目标任务
    {s:{r:7,c:8},e:{r:8,c:10}},   // I8:K8 完成情况（技能）
    {s:{r:7,c:11},e:{r:9,c:11}},  // L8:L10 完成百分比
    {s:{r:7,c:12},e:{r:9,c:12}},  // M8:M10 目标任务
    {s:{r:7,c:13},e:{r:8,c:15}},  // N8:P8 完成情况（高级工）
    {s:{r:7,c:16},e:{r:9,c:16}},  // Q8:Q10 完成百分比
    {s:{r:23,c:0},e:{r:23,c:19}}  // A24:T24 签名
  ];
  // 百分比公式（培训完成率只算补贴性 F/B；不含公益百行）
  rows.forEach(function(r, idx){
    var sr = cellSheetRow(idx);
    var tot = totalsOf(r), pt = +r.p_t||0;
    ws["G"+sr] = { t:"n", f:"F"+sr+"/B"+sr, v: pt>0 ? +(tot.pF/pt) : 0, z:"0.00%" };
    var js = +r.j_s||0, jsh = +r.j_shi||0, jt = +r.j_t||0;
    ws["L"+sr] = { t:"n", f:"K"+sr+"/H"+sr, v: jt>0 ? +((js+jsh)/jt) : 0, z:"0.00%" };
    var gs = +r.g_s||0, gsh = +r.g_shi||0, gt = +r.g_t||0;
    ws["Q"+sr] = { t:"n", f:"P"+sr+"/M"+sr, v: gt>0 ? +((gs+gsh)/gt) : 0, z:"0.00%" };
  });

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "5.7");
  XLSX.writeFile(wb, year + "年分县区人才队伍建设计划完成情况（截至" + year + "年" + (+mm) + "月）.xlsx");
}


function pctCell(done,target){
  var d=+done||0, t=+target||0;
  if(t<=0) return '<span>—</span>';
  var p=d/t; var cls=p<0.8?"pct-low":(p<1?"pct-mid":"pct-high");
  return '<span class="'+cls+'">'+(p*100).toFixed(2)+'%</span>';
}
function setVal(id,v){ document.getElementById(id).value=(v===null||v===undefined)?"":v; }
