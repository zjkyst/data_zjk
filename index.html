<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年分县区人才队伍月报 · 逐月填报系统</title>
<!-- ========== 接入 Supabase 前，把下面两个值换成你的项目 ==========
     supabase.com → Project Settings → API：
       Project URL → SUPABASE_URL ； anon public key → SUPABASE_ANON_KEY
================================================================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef2f7; color: #333; min-height: 100vh; padding-bottom: 40px; }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px 16px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.07); padding: 24px; margin-bottom: 20px; }
  h1 { font-size: 21px; color: #1a2a4a; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
  h2 { font-size: 16px; color: #1a2a4a; margin-bottom: 14px; }
  h3 { font-size: 14px; color: #2c3e50; margin: 22px 0 12px; padding-top: 14px; border-top: 1px dashed #dfe4ec; }
  .role-badge { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 13px; margin-bottom: 14px; }
  .role-member { background: #e8f0fe; color: #1a73e8; }
  .role-admin { background: #fdeee0; color: #d95b0c; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 10px; }
  .btn { display: inline-block; border: none; border-radius: 8px; padding: 9px 18px; font-size: 14px; cursor: pointer; transition: .2s; }
  .btn-primary { background: #1a73e8; color: #fff; } .btn-primary:hover { background: #1765cc; }
  .btn-secondary { background: #fff; color: #333; border: 1px solid #d0d7e2; } .btn-secondary:hover { background: #f5f7fa; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 13px; margin-bottom: 5px; color: #555; font-weight: 500; }
  input, select { width: 100%; padding: 9px 12px; border: 1px solid #d0d7e2; border-radius: 8px; font-size: 14px; background:#fff; }
  input:focus, select:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.12); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .readonly-input { background: #f6f8fb; color: #4a5568; }
  .hint { font-size: 12px; color: #98a2b3; margin-top: 4px; }
  .table-wrap { overflow-x: auto; }
  .save-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; gap: 10px; }
  .status { font-size: 13px; color: #0b8043; }
  .notice { font-size: 13px; color: #d93025; margin-top: 14px; line-height: 1.7; }
  .notice-info { font-size: 13px; color: #5a6472; margin-top: 14px; line-height: 1.7; background: #f7f9fc; padding: 12px 14px; border-radius: 8px; }
  .hidden { display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { border: 1px solid #dfe4ec; padding: 7px 8px; text-align: center; vertical-align: middle; }
  th { background: #f4f6fb; font-weight: 600; }
  td.req { text-align: left; font-weight: 500; }
  .pct-low { color: #c5221f; } .pct-mid { color: #b06000; } .pct-high { color: #137333; font-weight: 600; }
  .error { color: #d93025; font-size: 13px; margin-top: 8px; }
  .tabs { display: flex; gap: 8px; margin: 14px 0; }
  .tab { padding: 8px 16px; border: 1px solid #d0d7e2; border-radius: 8px; cursor: pointer; font-size: 13px; background:#fff; color:#333; }
  .tab.active { background: #1a73e8; color:#fff; border-color:#1a73e8; }
  .row-flex { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .field-inline { display:inline-block; }
  .field-inline label { margin-right:6px; display:inline; }
  .field-inline select { width:auto; display:inline-block; }
  .history-table td.left { text-align:left; font-size:12px; color:#444; }
  #adminCur table, #adminCum table, #adminLog table, #memberHistory table { display:block; overflow-x:auto; max-width:100%; }
  .target-input { width: 80px !important; padding: 4px 6px !important; font-size: 13px !important; }
</style>
</head>
<body>
<div class="container">

  <!-- ========== 登录页（无注册，账号由管理员预设） ========== -->
  <div id="authView" class="card" style="max-width:440px;margin:40px auto 0;">
    <h1 id="mainH1">太原市培训评价填报系统</h1>
    <div class="subtitle">逐月填报</div>
    <h2>登录</h2>
    <div class="field"><label>账号</label><input id="loginEmail" type="text"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">登 录</button>
    <div class="error" id="loginErr"></div>
  </div>

  <!-- ========== 主界面（登录后） ========== -->
  <div id="mainView" class="hidden">
    <div class="card">
      <div class="topbar">
        <div>
          <span class="role-badge" id="roleBadge"></span>
          <h2 id="greeting"></h2>
        </div>
        <div class="row-flex">
          <span id="userEmail" style="font-size:13px;color:#666;"></span>
          <button class="btn btn-secondary btn-sm" onclick="doLogout()">退出</button>
        </div>
      </div>

      <!-- 月份选择 -->
      <div class="row-flex" style="margin-bottom:8px;">
        <div class="field-inline"><label>选择月份：</label><select id="monthSelect" onchange="onMonthChange()"></select></div>
      </div>

      <!-- 填报员视图 -->
      <div id="memberForm" class="hidden">
        <p class="notice-info">若当月存在净减少（如撤销、退补、更正已确认人数），可直接填写<strong>负数</strong>，系统会按当月增减量累计。</p>
        <h3>① 开展补贴性职业技能培训人数</h3>
        <div class="field"><label>全年目标（只读）</label><input id="f_peixun_target" type="number" readonly class="readonly-input"></div>
        <div class="notice-info">就业重点群体（6 小类）</div>
        <div class="grid">
          <div class="field"><label>本月新增 · 毕业年度高校毕业生</label><input id="f_peixun_zd_biye_c" type="number"></div>
          <div class="field"><label>本月新增 · 城乡未升学初高中</label><input id="f_peixun_zd_chuzhong_c" type="number"></div>
          <div class="field"><label>本月新增 · 农村转移劳动力</label><input id="f_peixun_zd_nongcun_c" type="number"></div>
          <div class="field"><label>本月新增 · 脱贫劳动力</label><input id="f_peixun_zd_tuopin_c" type="number"></div>
          <div class="field"><label>本月新增 · 就业困难人员</label><input id="f_peixun_zd_kunnan_c" type="number"></div>
          <div class="field"><label>本月新增 · 失业人员</label><input id="f_peixun_zd_shiye_c" type="number"></div>
        </div>
        <div class="grid">
          <div class="field"><label>本月新增 · 企业职工培训</label><input id="f_peixun_qiye_c" type="number"></div>
          <div class="field"><label>本月新增 · 创业培训</label><input id="f_peixun_chuangye_c" type="number"></div>
          <div class="field"><label>本月新增 · 百行百业（仅市本级）</label><input id="f_peixun_baihang_c" type="number"></div>
          <div class="field"><label>本月新增 · 公益类培训</label><input id="f_peixun_gongyi_c" type="number"></div>
        </div>
        <div class="hint">完成情况合计：<b id="c_peixun">0</b>（含重点群体 <b id="c_peixun_zd">0</b> + 企业职工 <b id="c_peixun_qiye">0</b> + 创业 <b id="c_peixun_chuangye">0</b>）；百行百业 <b id="c_peixun_baihang">0</b>；公益类 <b id="c_peixun_gongyi">0</b></div>

        <h3>② 新增技能人才人数</h3>
        <div class="field"><label>全年目标（只读）</label><input id="f_jineng_target" type="number" readonly class="readonly-input"></div>
        <div class="grid">
          <div class="field"><label>本月新增 · 省级</label><input id="f_jineng_sheng_c" type="number"></div>
          <div class="field"><label>本月新增 · 市级</label><input id="f_jineng_shi_c" type="number"></div>
        </div>
        <div class="hint">截至本月累计：省级 <b id="c_jineng_sheng">0</b> + 市级 <b id="c_jineng_shi">0</b> = <b id="c_jineng">0</b></div>

        <h3>③ 新增取得高级工以上证书人数</h3>
        <div class="field"><label>全年目标（只读）</label><input id="f_gjg_target" type="number" readonly class="readonly-input"></div>
        <div class="grid">
          <div class="field"><label>本月新增 · 省级</label><input id="f_gjg_sheng_c" type="number"></div>
          <div class="field"><label>本月新增 · 市级</label><input id="f_gjg_shi_c" type="number"></div>
        </div>
        <div class="hint">截至本月累计：省级 <b id="c_gjg_sheng">0</b> + 市级 <b id="c_gjg_shi">0</b> = <b id="c_gjg">0</b></div>

        <div class="save-row">
          <span class="status" id="saveStatus"></span>
          <button class="btn btn-primary" onclick="saveMember()">保存本月填报</button>
        </div>
        <p class="notice" id="memberNotice"></p>

        <h3>历史填写记录（本县区）</h3>
        <div id="memberHistory"></div>
      </div>

      <!-- 管理员视图 -->
      <div id="adminPanel" class="hidden">
        <div class="save-row" style="margin-bottom:10px;">
          <span class="hint" id="exportHint">导出「截至 {所选月份}」的分县区完成情况表</span>
          <button class="btn btn-primary" onclick="exportExcel()">导出 Excel</button>
        </div>
        <div class="tabs">
          <div class="tab active" id="tab_cur" onclick="switchAdminTab('cur')">当月新增表</div>
          <div class="tab" id="tab_cum" onclick="switchAdminTab('cum')">累计表</div>
          <div class="tab" id="tab_log" onclick="switchAdminTab('log')">填写记录</div>
          <div class="tab" id="tab_target" onclick="switchAdminTab('target')">目标管理</div>
        </div>
        <div id="adminCur" class="hidden"></div>
        <div id="adminCum" class="hidden"></div>
        <div id="adminLog" class="hidden"></div>
        <div id="adminTarget" class="hidden"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
 * 配置：替换成你的 Supabase 项目
 * =================================================================== */
var SUPABASE_URL = "https://zyvmtoxjpnveaeokumts.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5dm10b3hqcG52ZWFlb2t1bXRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyMzcwMjAsImV4cCI6MjEwNzgxMzAyMH0.0tsFK1yZBVBzoaLCgCwqXjO_Wvs-IHruiJHo89aRBME";

var REGIONS = ["市本级","小店区","迎泽区","杏花岭区","尖草坪区","万柏林区","晋源区","清徐县","阳曲县","娄烦县","古交市","综改区"];
var FIELD_NAMES = {
  peixun_zd_biye_c:"培训·重点-毕业年度高校毕业生",
  peixun_zd_chuzhong_c:"培训·重点-城乡未升学初高中",
  peixun_zd_nongcun_c:"培训·重点-农村转移劳动力",
  peixun_zd_tuopin_c:"培训·重点-脱贫劳动力",
  peixun_zd_kunnan_c:"培训·重点-就业困难人员",
  peixun_zd_shiye_c:"培训·重点-失业人员",
  peixun_qiye_c:"培训·企业职工", peixun_chuangye_c:"培训·创业",
  peixun_baihang_c:"培训·百行百业", peixun_gongyi_c:"培训·公益类",
  jineng_sheng_c:"技能·省级", jineng_shi_c:"技能·市级",
  gjg_sheng_c:"高级工·省级", gjg_shi_c:"高级工·市级"
};

var sb = null, currentProfile = null;
var regionsData = {};
var myRows = {};
var adminRows = {};
var CURRENT_MONTH = null;

function ym(d){ var x=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); return x; }

function init(){
  if(SUPABASE_URL.indexOf("YOUR_")===0){ alert("请先在 index.html 顶部填入 Supabase Project URL 和 anon key（见 README）"); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true } });
  CURRENT_MONTH = ym(new Date());
  fillMonthOptions();
  sb.auth.getSession().then(function(res){
    if(res.data.session){ afterAuth(); } else { showAuth(true); }
  });
}
function showAuth(show){
  document.getElementById("authView").classList.toggle("hidden", !show);
  document.getElementById("mainView").classList.toggle("hidden", show);
}
function fillMonthOptions(){
  var sel = document.getElementById("monthSelect");
  var now = new Date();
  var curYear = now.getFullYear();
  var opts = [];
  // 跨年：最近 5 年；当年到当前月，其余年份到 12 月
  for(var y = curYear; y >= curYear - 4; y--){
    var lastMonth = (y === curYear) ? (now.getMonth() + 1) : 12;
    for(var m = lastMonth; m >= 1; m--){
      var v = y + '-' + String(m).padStart(2, '0');
      opts.push('<option value="'+v+'"'+(v===CURRENT_MONTH?' selected':'')+'>'+v+'</option>');
    }
  }
  sel.innerHTML = opts.join('');
}

function doLogin(){
  var email = document.getElementById("loginEmail").value.trim();
  var pass = document.getElementById("loginPass").value;
  document.getElementById("loginErr").textContent = "";
  sb.auth.signInWithPassword({ email: email, password: pass }).then(function(res){
    if(res.error){ document.getElementById("loginErr").textContent = res.error.message; return; }
    afterAuth();
  });
}
function doLogout(){ sb.auth.signOut().then(function(){ currentProfile=null; location.reload(); }); }

function afterAuth(){
  sb.auth.getUser().then(function(res){
    var user = res.data.user;
    document.getElementById("userEmail").textContent = user.email;
    sb.from("profiles").select("*").eq("id", user.id).single().then(function(pr){
      if(pr.error || !pr.data){
        alert("未找到该账号的县区档案，请联系管理员在后台绑定。");
        doLogout();
        return;
      }
      currentProfile = pr.data;
      showAuth(false);
      loadRegions(function(){ renderMain(); });
    });
  });
}

function loadRegions(cb){
  sb.from("regions").select("*").then(function(res){
    if(res.error || !res.data || res.data.length === 0){
      // 查询失败或无数据时保留已有缓存（避免之前保存的目标被清空）
      if(typeof cb === 'function') cb();
      return;
    }
    regionsData = {};
    (res.data||[]).forEach(function(r){
      var y = r.year || 2026;
      if(!regionsData[y]) regionsData[y] = {};
      regionsData[y][r.region] = r;
    });
    cb && cb();
  });
}

function renderMain(){
  var badge = document.getElementById("roleBadge");
  if(currentProfile.is_admin){
    badge.className="role-badge role-admin"; badge.textContent="管理员";
    document.getElementById("greeting").textContent="分县区汇总";
    document.getElementById("memberForm").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
    updateExportHint();
    loadAdminData();
  } else {
    badge.className="role-badge role-member";
    badge.textContent = "填报员 · "+(currentProfile.region||"未绑定");
    document.getElementById("greeting").textContent="数据填报";
    document.getElementById("adminPanel").classList.add("hidden");
    document.getElementById("memberForm").classList.remove("hidden");
    sb.from("monthly_reports").select("*").eq("region", currentProfile.region).then(function(res){
      if(res.error){ document.getElementById("memberNotice").textContent="读取失败："+res.error.message; return; }
      myRows = {};
      (res.data||[]).forEach(function(r){ (myRows[r.region]=myRows[r.region]||{})[r.report_month]=r; });
      renderMember();
    });
  }
}

function onMonthChange(){
  if(!currentProfile) return;
  updateTitleYear();
  if(currentProfile.is_admin){ renderAdminTables(); renderAdminLog(); updateExportHint(); }
  else { renderMember(); }
}
function updateTitleYear(){
  var m = document.getElementById("monthSelect").value; // YYYY-MM
  var y = m.split("-")[0];
  var h1 = document.getElementById("mainH1");
  if(h1){ h1.textContent = y + "年分县区人才队伍月报"; }
  document.title = y + "年分县区人才队伍月报 · 逐月填报系统";
}
function updateExportHint(){
  var ev = document.getElementById("exportHint");
  if(ev){ ev.textContent = "导出「截至 " + document.getElementById("monthSelect").value + "」的分县区完成情况表（累计）；也请在下方确认填报记录已同步。"; }
}

/* ---------- 填报员 ---------- */
function renderMember(){
  var region = currentProfile.region, month = document.getElementById("monthSelect").value;
  var year = month.split("-")[0];
  var t = (regionsData[year]||{})[region] || {};
  setVal("f_peixun_target", t.peixun_target);
  setVal("f_jineng_target", t.jineng_target);
  setVal("f_gjg_target", t.gjg_target);
  var row = (myRows[region]||{})[month] || {};
  setVal("f_peixun_zd_biye_c", row.peixun_zd_biye_c);
  setVal("f_peixun_zd_chuzhong_c", row.peixun_zd_chuzhong_c);
  setVal("f_peixun_zd_nongcun_c", row.peixun_zd_nongcun_c);
  setVal("f_peixun_zd_tuopin_c", row.peixun_zd_tuopin_c);
  setVal("f_peixun_zd_kunnan_c", row.peixun_zd_kunnan_c);
  setVal("f_peixun_zd_shiye_c", row.peixun_zd_shiye_c);
  setVal("f_peixun_qiye_c", row.peixun_qiye_c);
  setVal("f_peixun_chuangye_c", row.peixun_chuangye_c);
  setVal("f_peixun_gongyi_c", row.peixun_gongyi_c);
  // 百行百业仅市本级可填，其他区县禁用并置空
  var isShi = (region === "市本级");
  var bh = document.getElementById("f_peixun_baihang_c");
  bh.disabled = !isShi;
  bh.value = isShi ? (row.peixun_baihang_c == null ? "" : row.peixun_baihang_c) : "";
  setVal("f_jineng_sheng_c", row.jineng_sheng_c);
  setVal("f_jineng_shi_c", row.jineng_shi_c);
  setVal("f_gjg_sheng_c", row.gjg_sheng_c);
  setVal("f_gjg_shi_c", row.gjg_shi_c);
  computeCum(region, month);
  document.getElementById("memberNotice").textContent = ((myRows[region]||{})[month] && row.updated_at)
    ? ("本月已填报："+new Date(row.updated_at).toLocaleString()) : "本月尚未填报";
  document.getElementById("saveStatus").textContent = "";
  renderHistory(region);
}
function renderHistory(region){
  region = region || ((currentProfile||{}).region);
  var el = document.getElementById("memberHistory");
  if(!el) return;
  var months = Object.keys((myRows[region]||{})).sort().reverse(); // 月份倒序（新→旧）
  if(months.length === 0){ el.innerHTML = '<p style="color:#999;padding:8px 0;">暂无历史填报记录。</p>'; return; }
  var html = '<p class="notice-info">本县区各月填报情况（倒序）</p>';
  html += '<table><thead><tr>'+
    '<th>月份</th><th>培训·重点(6类合计)</th><th>培训·企业</th><th>培训·创业</th><th>百行百业</th><th>公益类</th>'+
    '<th>技能·省</th><th>技能·市</th><th>高级工·省</th><th>高级工·市</th><th>填报时间</th></tr></thead><tbody>';
  months.forEach(function(m){
    var r = (myRows[region]||{})[m] || {};
    var zdSum = (+r.peixun_zd_biye_c||0)+(+r.peixun_zd_chuzhong_c||0)+(+r.peixun_zd_nongcun_c||0)+(+r.peixun_zd_tuopin_c||0)+(+r.peixun_zd_kunnan_c||0)+(+r.peixun_zd_shiye_c||0);
    html += '<tr><td>'+m+'</td>'+
      '<td>'+zdSum+'</td><td>'+(+r.peixun_qiye_c||0)+'</td><td>'+(+r.peixun_chuangye_c||0)+'</td>'+
      '<td>'+(+r.peixun_baihang_c||0)+'</td><td>'+(+r.peixun_gongyi_c||0)+'</td>'+
      '<td>'+(+r.jineng_sheng_c||0)+'</td><td>'+(+r.jineng_shi_c||0)+'</td>'+
      '<td>'+(+r.gjg_sheng_c||0)+'</td><td>'+(+r.gjg_shi_c||0)+'</td>'+

// 批量保存目标值（带年份）
function saveAdminTargets(){
  var statusEl = document.getElementById("targetSaveStatus");
  if(!statusEl) return;
  var inputs = document.querySelectorAll(".target-input");
  var updates = {}, updateKeys = [], errCount = 0;
  inputs.forEach(function(inp){
    var year = +inp.getAttribute("data-year") || 2026;
    var region = inp.getAttribute("data-region");
    var field = inp.getAttribute("data-field");
    var val = +(inp.value) || 0;
    var key = year + "|" + region;
    if(!updates[key]){ updates[key] = {year:year, region:region}; updateKeys.push(key); }
    updates[key][field] = val;
  });
  if(updateKeys.length === 0){ statusEl.textContent = "没有数据可保存。"; return; }
  statusEl.textContent = "正在保存…";
  var done = 0;
  // 用 upsert 替代先 update 再 fallback insert 的两步法
  updateKeys.forEach(function(key){
    var u = updates[key];
    var record = { year: u.year, region: u.region, peixun_target: u.peixun_target, jineng_target: u.jineng_target, gjg_target: u.gjg_target };
    sb.from("regions").upsert(record, { onConflict: "year,region" }).then(function(res){
      done++;
      if(res.error) errCount++;
      // 无论 success/error，每次完成后检查是否全部完成
      if(done === updateKeys.length){
        // 手动刷新 regionsData 缓存
        updateKeys.forEach(function(kk){
          var uu = updates[kk];
          if(!regionsData[uu.year]) regionsData[uu.year] = {};
          regionsData[uu.year][uu.region] = { year: uu.year, region: uu.region, peixun_target: uu.peixun_target, jineng_target: uu.jineng_target, gjg_target: uu.gjg_target };
        });
        if(typeof renderAdminTables === 'function') renderAdminTables();
        statusEl.textContent = errCount > 0 ? ("保存完成，" + errCount + " 个失败：请确认数据库RLS策略已添加") : "全部保存成功 ✓";
      }
    });
  });
}

// 新增目标年份（复制上一年的所有目标）
function addNewTargetYear(){
  var sel = document.getElementById("targetYearSelect");
  if(!sel) return;
  var curYear = +sel.value;

  if(!confirm("即将创建 " + newYear + " 年目标（从 " + curYear + " 年复制），确认？")) return;
  // 复制该年所有目标
  sb.from("regions").select("*").eq("year", curYear).then(function(res){
    if(res.error){ alert("读取失败："+res.error.message); return; }
    var rows = res.data || [];
    if(rows.length === 0){ alert(curYear + " 年无目标数据，无法复制。"); return; }
    var inserts = rows.map(function(r){
      return sb.from("regions").insert({ year: newYear, region: r.region, peixun_target: r.peixun_target, jineng_target: r.jineng_target, gjg_target: r.gjg_target });

      if(errs > 0){ alert("部分新增失败，"+errs+" 个错误"); }
      renderAdminTargets(); // 刷新
    });
  });
}

function cumVal(region, month, field){
  var rows = adminRows[region] || {}, s = 0;

}

  function totalsOf(r){
    var pF = r.p_zd_biye+r.p_zd_chuzhong+r.p_zd_nongcun+r.p_zd_tuopin+r.p_zd_kunnan+r.p_zd_shiye + r.p_qiye + r.p_chuangye;
    return { pF:pF, pTai: pF + r.p_gongyi + r.p_baihang, j_tot: r.j_s+r.j_shi, g_tot: r.g_s+r.g_shi };
  }
  var detail = REGIONS.map(regionRow);
  // 太原市（汇总）行：加总
  var tai = { name:"太原市", p_t:0, p_zd_biye:0,p_zd_chuzhong:0,p_zd_nongcun:0,p_zd_tuopin:0,p_zd_kunnan:0,p_zd_shiye:0, p_qiye:0,p_chuangye:0,p_baihang:0,p_gongyi:0, j_t:0,j_s:0,j_shi:0, g_t:0,g_s:0,g_shi:0 };
  detail.forEach(function(r){
    tai.p_t+=r.p_t; tai.p_zd_biye+=r.p_zd_biye; tai.p_zd_chuzhong+=r.p_zd_chuzhong; tai.p_zd_nongcun+=r.p_zd_nongcun; tai.p_zd_tuopin+=r.p_zd_tuopin; tai.p_zd_kunnan+=r.p_zd_kunnan; tai.p_zd_shiye+=r.p_zd_shiye;
    tai.p_qiye+=r.p_qiye; tai.p_chuangye+=r.p_chuangye; tai.p_baihang+=r.p_baihang; tai.p_gongyi+=r.p_gongyi;
    tai.j_t+=r.j_t; tai.j_s+=r.j_s; tai.j_shi+=r.j_shi;
    tai.g_t+=r.g_t; tai.g_s+=r.g_s; tai.g_shi+=r.g_shi;
  });
  var rows = [tai].concat(detail);

  // ========= 构建 SheetJS 工作表 =========
  // 行号（1 起）：1-2 标题, 4 截至, 6-10 表头, 11 太原市, 12-23 区县, 24 签名
  function cellSheetRow(idx){ return (idx + 11); }

  // 25 列布局对齐《太原市培训报送.xlsx》模板
  // A县区 B目标 C-H重点6子类 I企业 J创业 K完成 L% M百行 N公益 O太原培训 P-T技能 U-Y高级工
  var aoa = [];
  for(var i=0;i<24;i++){ aoa.push(new Array(25).fill(null)); }
  aoa[0][0] = year + "年分县区人才队伍建设计划完成情况";
  aoa[3][0] = "                                        " + dateLabel;
  // 行6(索引5) 大标题
  aoa[5][0]  = "县区";
  aoa[5][1]  = "开展补贴性职业技能培训人数";
  aoa[5][12] = "其他培训";
  aoa[5][15] = "新增技能人才人数";
  aoa[5][20] = "新增取得高级工以上职业资格\n或职业技能等级证书的人数";
  // 行8(索引7) 列名
  aoa[7][1]  = "目标任务"; aoa[7][2] = "就业重点群体培训"; aoa[7][8] = "企业职工培训"; aoa[7][9] = "创业培训"; aoa[7][10] = "完成情况"; aoa[7][11] = "完成百分比";
  aoa[7][12] = "百行百业（市本级填写）"; aoa[7][13] = "公益类培训"; aoa[7][14] = "太原市培训总数（完成情况加mn）";
  aoa[7][15] = "目标任务"; aoa[7][16] = "完成情况"; aoa[7][19] = "完成百分比";
  aoa[7][20] = "目标任务"; aoa[7][21] = "完成情况"; aoa[7][24] = "完成百分比";
  // 行10(索引9) 细分子列
  aoa[9][2]  = "毕业年度高校毕业生"; aoa[9][3] = "城乡为继续升学的应届初高中"; aoa[9][4] = "农村转移就业劳动力"; aoa[9][5] = "脱贫劳动力"; aoa[9][6] = "就业困难人员"; aoa[9][7] = "失业人员";
  aoa[9][16] = "省级"; aoa[9][17] = "市级"; aoa[9][18] = "总计";
  aoa[9][21] = "省级"; aoa[9][22] = "市级"; aoa[9][23] = "总计";
  // 数据行
  rows.forEach(function(r, idx){
    var sr = cellSheetRow(idx);
    var a = aoa[sr-1];
    var tot = totalsOf(r);
    a[0]  = r.name;
    a[1]  = r.p_t; a[2] = r.p_zd_biye; a[3] = r.p_zd_chuzhong; a[4] = r.p_zd_nongcun; a[5] = r.p_zd_tuopin; a[6] = r.p_zd_kunnan; a[7] = r.p_zd_shiye;
    a[8]  = r.p_qiye; a[9] = r.p_chuangye; a[10] = tot.pF; a[12] = r.p_baihang; a[13] = r.p_gongyi; a[14] = tot.pTai;
    a[15] = r.j_t; a[16] = r.j_s; a[17] = r.j_shi; a[18] = tot.j_tot;
    a[20] = r.g_t; a[21] = r.g_s; a[22] = r.g_shi; a[23] = tot.g_tot;
  });
  aoa[23][0] = "单位负责人：                                       处（科）室负责人：                                                     填报人：";

  var ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: false });
  ws['!cols'] = [
    {wch:11},{wch:9},{wch:10},{wch:11},{wch:11},{wch:10},{wch:11},{wch:11},{wch:9},{wch:9},{wch:10},{wch:9},
    {wch:10},{wch:10},{wch:12},
    {wch:8},{wch:7},{wch:7},{wch:7},{wch:8},
    {wch:8},{wch:7},{wch:7},{wch:7},{wch:8}
  ];
  ws['!merges'] = [
    {s:{r:0,c:0},e:{r:1,c:24}},
    {s:{r:3,c:0},e:{r:3,c:24}},
    {s:{r:5,c:0},e:{r:9,c:0}},
    {s:{r:5,c:1},e:{r:6,c:11}},   // B6:L7 培训
    {s:{r:5,c:12},e:{r:6,c:14}},  // M6:O7 其他培训
    {s:{r:5,c:15},e:{r:6,c:19}},  // P6:T7 技能
    {s:{r:5,c:20},e:{r:6,c:24}},  // U6:Y7 高级工
    {s:{r:7,c:1},e:{r:9,c:1}},    // B8:B10 目标
    {s:{r:7,c:2},e:{r:8,c:7}},    // C8:H9 重点群体
    {s:{r:7,c:8},e:{r:9,c:8}},    // I8:I10 企业
    {s:{r:7,c:9},e:{r:9,c:9}},    // J8:J10 创业
    {s:{r:7,c:10},e:{r:9,c:10}},  // K8:K10 完成
    {s:{r:7,c:11},e:{r:9,c:11}},  // L8:L10 百分比
    {s:{r:7,c:12},e:{r:9,c:12}},  // M8:M10 百行
    {s:{r:7,c:13},e:{r:9,c:13}},  // N8:N10 公益
    {s:{r:7,c:14},e:{r:9,c:14}},  // O8:O10 太原培训
    {s:{r:7,c:15},e:{r:9,c:15}},  // P8:P10 技能目标
    {s:{r:7,c:16},e:{r:8,c:18}},  // Q8:S8 技能完成
    {s:{r:7,c:19},e:{r:9,c:19}},  // T8:T10 技能%
    {s:{r:7,c:20},e:{r:9,c:20}},  // U8:U10 高级目标
    {s:{r:7,c:21},e:{r:8,c:23}},  // V8:X8 高级完成
    {s:{r:7,c:24},e:{r:9,c:24}},  // Y8:Y10 高级%
    {s:{r:23,c:0},e:{r:23,c:24}}  // A24:Y24 签名
  ];
  rows.forEach(function(r, idx){
    var sr = cellSheetRow(idx);
    var tot = totalsOf(r), pt = +r.p_t||0;
    ws["L"+sr] = { t:"n", f:"K"+sr+"/B"+sr, v: pt>0 ? +(tot.pF/pt) : 0, z:"0.00%" };
    var js = +r.j_s||0, jsh = +r.j_shi||0, jt = +r.j_t||0;
    ws["T"+sr] = { t:"n", f:"S"+sr+"/P"+sr, v: jt>0 ? +((js+jsh)/jt) : 0, z:"0.00%" };
    var gs = +r.g_s||0, gsh = +r.g_shi||0, gt = +r.g_t||0;
    ws["Y"+sr] = { t:"n", f:"X"+sr+"/U"+sr, v: gt>0 ? +((gs+gsh)/gt) : 0, z:"0.00%" };
  });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "5.7");
  XLSX.writeFile(wb, year + "年分县区人才队伍建设计划完成情况（截至" + year + "年" + (+mm) + "月）.xlsx");
}


function pctCell(done,target){
  var d=+done||0, t=+target||0;
  if(t<=0) return '<span>—</span>';
  var p=d/t; var cls=p<0.8?"pct-low":(p<1?"pct-mid":"pct-high");
  return '<span class="'+cls+'">'+(p*100).toFixed(2)+'%</span>';
}
function setVal(id,v){ document.getElementById(id).value=(v===null||v===undefined)?"":v; }

init();
</script>
