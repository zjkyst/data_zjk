name: Sync fork with upstream API
on:
  schedule:
    - cron: "0 0 * * *"      # 每天 UTC 0 点运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Call merge-upstream API
        run: |
          gh api -X POST /repos/${{ github.repository }}/merge-upstream \
            -f branch=main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
